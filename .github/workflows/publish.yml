name: Publish to deka.gg

# deka.gg renders this repo's lessons at a pinned, checksum-verified ref
# (dekaruntime/website, deka#833). The pin lives in that repo, so a push
# here must move it there: a split without automatic regeneration means the
# published tour drifts from the tests that validate it, silently (deka#834).
# Same reasoning and the same credential as dekaruntime/rfd's publish.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A burst of pushes should redeploy the site once, after the last of them,
# not once per push.
concurrency:
  group: publish-to-deka-gg
  cancel-in-progress: true

jobs:
  notify:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # CASCADE_DISPATCH_TOKEN is the org's cross-repo dispatch credential
      # (dekaruntime/rfd publish.yml, deka release.yml). Unlike rfd, a missed
      # dispatch is NOT covered by the website's 2-hourly schedule: that
      # schedule redeploys the existing pin, it does not move it. So a
      # missing token is a red run here, not a skipped step -- silent
      # staleness is the failure this workflow exists to remove.
      - name: Trigger a deka.gg tour pin bump and rebuild
        run: |
          if [ -z "${{ secrets.CASCADE_DISPATCH_TOKEN }}" ]; then
            echo "::error::CASCADE_DISPATCH_TOKEN is not provisioned for this" \
              "repo; deka.gg cannot be told to bump the tour pin and will keep" \
              "serving the old lessons. Provision the org secret (see" \
              "dekaruntime/rfd publish.yml) and re-run this workflow."
            exit 1
          fi
          # curl, not the gh CLI: gh is not installed on the self-hosted
          # runners (dekaruntime/rfd publish.yml), which is why this mirrors
          # that workflow's shape exactly.
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CASCADE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/website/dispatches \
            -d '{"event_type":"tour-content-updated","client_payload":{"repo":"dekaruntime/tour","sha":"${{ github.sha }}"}}'
